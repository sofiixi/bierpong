<!doctype html>
<html lang="de">
<head>
<title>Bierpong-Turnier FSR</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Archivo:wght@400;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: control desk (Teams / Gruppen / K.-o.) for the laptop, plus a beamer view with a giant shared round timer. Single dark "bar at night" look. */
:root{
  --bg:#0C1A24; --panel:#132838; --panel2:#1A3447; --line:#27475D;
  --fg:#F3EEE2; --muted:#9DB3C2;
  --beer:#F2A33A; --foam:#FFF4DA;
  --blue:#3893CF; --green:#1BA855; --red:#E73D3E;
  --f-display:'Archivo Black','Arial Black',Arial,sans-serif;
  --f-body:'Archivo',Arial,sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:48px 48px;background-position:-1px -1px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0;background:radial-gradient(ellipse at 50% 0%,rgba(12,26,36,.55),var(--bg) 70%);pointer-events:none;z-index:0}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:20px 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;gap:20px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--beer);outline-offset:2px}
.mono{font-family:var(--f-mono)}
.tab-num{font-variant-numeric:tabular-nums}

/* header */
header{display:flex;flex-wrap:wrap;align-items:center;gap:16px 24px}
.brand{display:flex;align-items:center;gap:14px;min-width:0}
.fsr{display:flex;gap:4px}
.fsr span{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-size:14px;color:#fff;border:3px solid rgba(0,0,0,.25)}
.brand h1{margin:0;font-family:var(--f-display);font-size:28px;line-height:1;letter-spacing:-.5px}
.brand p{margin:2px 0 0;font-family:var(--f-mono);font-size:12px;color:var(--muted)}
nav{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
nav a{padding:9px 14px;border-radius:10px;text-decoration:none;color:var(--muted);font-weight:700;border:1px solid transparent}
nav a:hover{color:var(--fg);border-color:var(--line)}
nav a[aria-current="page"]{background:var(--panel2);color:var(--fg);border-color:var(--line)}
nav a.show{color:var(--bg);background:var(--beer)}
.sync{font-family:var(--f-mono);font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync.ok i{background:var(--green)} .sync.warn i{background:var(--beer)}

/* panels */
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:14px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:20px;letter-spacing:.2px}
.prompt{font-family:var(--f-mono);font-size:12px;color:var(--green)}
.prompt::before{content:"$ ";color:var(--muted)}
.hint{color:var(--muted);font-size:14px;line-height:1.5;margin:0;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.btn{border:0;border-radius:10px;padding:10px 16px;font-weight:700;background:var(--panel2);border:1px solid var(--line)}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--beer);color:#24160A;border-color:var(--beer)}
.btn.go{background:var(--green);border-color:var(--green);color:#fff}
.btn.stop{background:var(--red);border-color:var(--red);color:#fff}
.btn.small{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
label.field{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--muted)}
input[type=number],select,textarea,input[type=text]{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:220px;resize:vertical;font-family:var(--f-mono);font-size:14px;line-height:1.6}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:20px}
@media (max-width:820px){.grid2{grid-template-columns:1fr}}

/* timer bar */
.timerbar{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:14px 18px}
.tb-time{font-family:var(--f-mono);font-weight:700;font-size:38px;line-height:1;min-width:5ch}
.tb-state{font-family:var(--f-mono);font-size:12px;padding:4px 8px;border-radius:6px;background:var(--bg);color:var(--muted)}
.tb-state.run{color:var(--green)} .tb-state.over{color:#fff;background:var(--red)}
.timerbar .row{margin-left:auto}

/* groups */
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:20px}
.ghead{display:flex;align-items:center;gap:10px}
.gbadge{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;font-family:var(--f-display);font-size:18px;color:#fff}
.tablewrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{font-family:var(--f-mono);font-size:11px;font-weight:500;color:var(--muted);text-align:right;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right}
th:nth-child(2),td:nth-child(2){text-align:left;width:100%}
td.pts{font-weight:700;color:var(--beer)}
tr.q td:first-child{box-shadow:inset 3px 0 0 var(--green)}
.matches{display:flex;flex-direction:column;gap:8px}
.rlabel{font-family:var(--f-mono);font-size:11px;color:var(--muted);margin-top:4px}
.match{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr) auto;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--bg);border:1px solid var(--line)}
.match.done{border-color:rgba(27,168,85,.45)}
.match .t{min-width:0;overflow-wrap:anywhere;font-weight:600}
.match .t.b{text-align:right}
.match .t.win{color:var(--beer)}
.match input{width:56px;text-align:center;font-family:var(--f-mono);font-weight:700;font-size:16px;padding:7px 4px}
.match .score{font-family:var(--f-mono);font-weight:700;font-size:18px;min-width:3ch;text-align:center}
.match .vs{color:var(--muted);font-family:var(--f-mono)}
@media (max-width:520px){.match{grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr);}.match .act{grid-column:1/-1;justify-self:end}}

/* bracket */
.bracket{display:flex;gap:22px;overflow-x:auto;padding-bottom:6px}
.round{display:flex;flex-direction:column;justify-content:space-around;gap:14px;min-width:250px;flex:1}
.round h3{margin:0;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:1px}
.kocard{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px}
.kocard.done{border-color:rgba(27,168,85,.45)}
.kline{display:flex;align-items:center;gap:8px}
.kline .t{flex:1;min-width:0;overflow-wrap:anywhere;font-weight:600}
.kline .t.tbd{color:var(--muted);font-style:italic;font-weight:400}
.kline .t.win{color:var(--beer)}
.kline input{width:54px;text-align:center;font-family:var(--f-mono);font-weight:700;padding:6px 4px}
.kline .score{font-family:var(--f-mono);font-weight:700;min-width:2ch;text-align:right}
.champ{display:flex;align-items:center;gap:16px;padding:18px;border-radius:16px;background:linear-gradient(90deg,rgba(242,163,58,.25),transparent);border:1px solid var(--beer)}
.champ b{font-family:var(--f-display);font-size:26px}

.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding:36px 16px;color:var(--muted)}
.empty strong{color:var(--fg);font-size:18px}
.confirmbox{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-radius:10px;border:1px solid var(--red);background:rgba(231,61,62,.12)}
.notice{font-size:13px;color:var(--beer)}

/* ===== Beamer display ===== */
.show-root{position:fixed;inset:0;z-index:5;background:var(--bg);overflow:auto;display:flex;flex-direction:column;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(24px,env(safe-area-inset-left,0px));gap:18px}
.show-top{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.show-top .brand h1{font-size:clamp(22px,2.4vw,36px)}
.show-top .row{margin-left:auto}
.show-main{flex:1;display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:22px;min-height:0}
@media (max-width:900px){.show-main{grid-template-columns:1fr}}
.clock{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;border-radius:24px;background:var(--panel);border:1px solid var(--line);padding:24px;overflow:hidden;min-height:340px}
.clock .lbl{font-family:var(--f-mono);font-size:clamp(14px,1.4vw,22px);color:var(--muted)}
.clock .big{font-family:var(--f-mono);font-weight:700;font-size:clamp(90px,15vw,260px);line-height:.95;letter-spacing:-4px;font-variant-numeric:tabular-nums}
.clock .bar{width:80%;height:14px;border-radius:7px;background:var(--bg);overflow:hidden;border:1px solid var(--line)}
.clock .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--beer),var(--foam));transition:width .5s linear}
.clock.low .big{color:var(--beer)}
.clock.over{background:var(--red);border-color:var(--red)}
.clock.over .big,.clock.over .lbl{color:#fff}
.clock.over .big{animation:blink 1s steps(2,start) infinite}
.clock.starting{background:var(--green);border-color:var(--green)}
.clock.starting .big,.clock.starting .lbl{color:#fff}
@keyframes blink{to{visibility:hidden}}
.bubbles{position:absolute;inset:0;pointer-events:none}
.bubbles span{position:absolute;bottom:-20px;border-radius:50%;border:2px solid rgba(255,244,218,.25);animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-120vh)}}
@media (prefers-reduced-motion:reduce){.bubbles{display:none}.clock.over .big{animation:none}}
.side{display:flex;flex-direction:column;gap:16px;min-height:0}
.side .panel{padding:16px}
.side h2{font-size:18px}
.nextlist{display:flex;flex-direction:column;gap:8px}
.nextm{display:flex;align-items:center;gap:10px;font-size:clamp(15px,1.3vw,20px);font-weight:600}
.nextm .gbadge{width:28px;height:28px;font-size:14px;border-radius:8px;flex:none}
.nextm .vs{color:var(--muted);font-family:var(--f-mono);font-size:.8em}
.minitables{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:12px}
.minitables table td,.minitables table th{padding:4px 4px;font-size:clamp(12px,1vw,16px)}
.show-ko{display:flex;gap:14px;overflow-x:auto}
.show-ko .round{min-width:180px}
.show-ko .kocard{padding:8px}
</style>
</head>
<body>

<div id="app"></div>

<script>
(function(){
"use strict";
const COLORS=['var(--blue)','var(--green)','var(--red)','var(--beer)','#8E6BD8','#2BB3B1','#D96AA8','#7A9A3A'];
const DEMO=["Null Pointer Pints","Stack Overflow","git push --force","Segfault Squad","404 Becher Not Found","Bit Brewers","Recursion Rangers","Sudo Schluck","Kernel Panic","Byte Me","The Debuggers","Hopfen++"];
const KEY='fsr-bierpong-v1';
const blank=()=>({v:1,teams:[],settings:{groups:2,advance:2,cups:10,minutes:10},groups:[],matches:[],ko:null,timer:{status:'idle',endAt:0,remaining:600000,startedAt:0,dur:600000}});
let S=blank();
let docRef=null, syncState='local', lastJson='';
const drafts={};          // match id -> {a,b}
let ui={confirm:null, teamText:null, sound:false};

/* ---------- storage ---------- */
function loadLocal(){try{const j=localStorage.getItem(KEY);if(j){S=Object.assign(blank(),JSON.parse(j));lastJson=j}}catch(e){}}
function saveLocal(j){try{localStorage.setItem(KEY,j)}catch(e){}}
let writing=false, pending=null;
async function flush(){
  if(writing||!docRef||!pending)return;
  writing=true;const j=pending;pending=null;
  try{await docRef.set({json:j,at:Date.now()});setSync('ok')}catch(e){setSync('warn','Speichern fehlgeschlagen – lokal gesichert')}
  writing=false; if(pending)flush();
}
function commit(){
  const j=JSON.stringify(S);if(j===lastJson){render();return}
  lastJson=j;saveLocal(j);pending=j;flush();render();
}
function setSync(s,msg){syncState=s;syncMsg=msg||'';const el=document.getElementById('sync');if(el){el.className='sync '+s;el.lastChild.textContent=label()}}
let syncMsg='';
function label(){return syncMsg||({ok:'live synchron',warn:'verbinde…',local:'offline · auf diesem Laptop gespeichert'})[syncState]}

async function initDb(){
  if(!window.claude||!window.claude.use){setSync('local');return}
  setSync('warn');
  let db=null;try{db=await window.claude.use('db')}catch(e){}
  if(!db){syncMsg='';setSync('local');return}
  docRef=db.doc('turnier/state');
  const t=setTimeout(()=>{setSync('warn','Server antwortet nicht – lokal weiter')},10000);
  docRef.onSnapshot(snap=>{
    if(!snap.metadata||!snap.metadata.fromCache)clearTimeout(t);
    const d=snap.exists?snap.data():null;
    if(d&&typeof d.json==='string'){
      if(d.json!==lastJson){try{S=Object.assign(blank(),JSON.parse(d.json));lastJson=d.json;saveLocal(d.json);render()}catch(e){}}
    }else if(!snap.metadata||!snap.metadata.fromCache){ if(S.teams.length){pending=lastJson||JSON.stringify(S);flush()} }
    syncMsg='';setSync('ok');
  },err=>{clearTimeout(t);docRef=null;setSync('local','Sync aus – nur dieses Gerät')});
}

/* ---------- helpers ---------- */
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const team=id=>S.teams.find(t=>t.id===id);
const tname=id=>id==null?'—':(team(id)?team(id).name:'?');
const gl=i=>String.fromCharCode(65+i);
const uid=()=>Math.random().toString(36).slice(2,9);
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function fmt(ms){ms=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(ms/60)).padStart(2,'0')+':'+String(ms%60).padStart(2,'0')}

/* round robin (circle method) */
function roundRobin(ids){
  const p=ids.slice();if(p.length%2)p.push(null);
  const n=p.length,rounds=[];
  for(let r=0;r<n-1;r++){const pr=[];for(let i=0;i<n/2;i++){const a=p[i],b=p[n-1-i];if(a!=null&&b!=null)pr.push(r%2?[b,a]:[a,b])}rounds.push(pr);p.splice(1,0,p.pop())}
  return rounds;
}
function standings(g){
  const rows=g.teamIds.map(id=>({id,sp:0,s:0,u:0,n:0,cf:0,ca:0,pts:0}));
  const by=Object.fromEntries(rows.map(r=>[r.id,r]));
  S.matches.filter(m=>m.g===g.i&&m.done).forEach(m=>{
    const A=by[m.a],B=by[m.b];if(!A||!B)return;
    A.sp++;B.sp++;A.cf+=m.ca;A.ca+=m.cb;B.cf+=m.cb;B.ca+=m.ca;
    if(m.ca>m.cb){A.s++;B.n++;A.pts+=3}else if(m.cb>m.ca){B.s++;A.n++;B.pts+=3}else{A.u++;B.u++;A.pts++;B.pts++}
  });
  return rows.sort((x,y)=>y.pts-x.pts||(y.cf-y.ca)-(x.cf-x.ca)||y.cf-x.cf||tname(x.id).localeCompare(tname(y.id)));
}

/* ---------- actions ---------- */
function parseTeams(txt){const seen=new Set();return txt.split(/\n/).map(s=>s.trim()).filter(s=>s&&!seen.has(s.toLowerCase())&&seen.add(s.toLowerCase()))}
function draw(){
  const names=parseTeams(ui.teamText!=null?ui.teamText:S.teams.map(t=>t.name).join('\n'));
  if(names.length<4)return;
  const gc=Math.max(1,Math.min(+S.settings.groups,Math.floor(names.length/3)));
  S.teams=names.map(n=>({id:uid(),name:n}));
  const ids=shuffle(S.teams.map(t=>t.id));
  S.groups=Array.from({length:gc},(_,i)=>({i,teamIds:[]}));
  ids.forEach((id,k)=>S.groups[k%gc].teamIds.push(id));
  S.matches=[];
  S.groups.forEach(g=>roundRobin(g.teamIds).forEach((pr,r)=>pr.forEach(([a,b])=>S.matches.push({id:uid(),g:g.i,r,a,b,ca:null,cb:null,done:false}))));
  S.ko=null;ui.teamText=null;ui.confirm=null;
  for(const k in drafts)delete drafts[k];
  location.hash='gruppen';commit();
}
function saveMatch(id){
  const m=S.matches.find(x=>x.id===id);const d=drafts[id];if(!m||!d)return;
  const c=+S.settings.cups;const a=parseInt(d.a,10),b=parseInt(d.b,10);
  if(isNaN(a)||isNaN(b)||a<0||b<0||a>c||b>c){d.err=true;render();return}
  m.ca=a;m.cb=b;m.done=true;delete drafts[id];commit();
}
function editMatch(id){const m=S.matches.find(x=>x.id===id);if(!m)return;drafts[id]={a:m.ca,b:m.cb};m.done=false;commit()}

/* knockout */
function seedOrder(size){let o=[1];while(o.length<size){const L=o.length*2;o=o.flatMap(x=>[x,L+1-x])}return o}
function buildKO(){
  const adv=+S.settings.advance;const tables=S.groups.map(standings);const seeds=[];
  for(let r=0;r<adv;r++)tables.forEach(t=>{if(t[r])seeds.push(t[r].id)});
  if(seeds.length<2)return;
  let size=2;while(size<seeds.length)size*=2;
  const order=seedOrder(size).map(s=>s<=seeds.length?seeds[s-1]:null);
  const rounds=[];const first=[];
  for(let i=0;i<size;i+=2)first.push({a:order[i],b:order[i+1]});
  rounds.push(first);for(let n=size/4;n>=1;n/=2)rounds.push(Array.from({length:n},()=>({})));
  S.ko={rounds,results:{}};ui.confirm=null;location.hash='ko';commit();
}
function koView(){
  if(!S.ko)return null;
  const R=S.ko.rounds.map(r=>r.map(x=>({a:x.a,b:x.b})));
  for(let r=0;r<R.length;r++){
    R[r].forEach((m,i)=>{
      if(r>0){const p1=R[r-1][2*i],p2=R[r-1][2*i+1];m.a=p1.w;m.b=p2.w}
      m.key=r+'-'+i;m.bye=r===0&&(m.a==null||m.b==null);
      if(m.bye){m.w=m.a!=null?m.a:m.b;m.done=true;return}
      const res=S.ko.results[m.key];
      if(res&&m.a!=null&&m.b!=null&&res.ta===m.a&&res.tb===m.b){Object.assign(m,{ca:res.ca,cb:res.cb,done:true,w:res.w})}else{m.w=undefined}
    });
  }
  return R;
}
function saveKO(key,a,b,forceW){
  const R=koView();const [r,i]=key.split('-').map(Number);const m=R[r][i];const d=drafts['ko'+key]||{};
  const c=+S.settings.cups;const ca=parseInt(d.a,10),cb=parseInt(d.b,10);
  if(isNaN(ca)||isNaN(cb)||ca<0||cb<0||ca>c||cb>c){d.err=true;drafts['ko'+key]=d;render();return}
  let w=ca>cb?m.a:cb>ca?m.b:forceW;
  if(w===undefined){d.tie=true;drafts['ko'+key]=d;render();return}
  S.ko.results[key]={ta:m.a,tb:m.b,ca,cb,w};delete drafts['ko'+key];commit();
}
function editKO(key){const res=S.ko.results[key];if(res)drafts['ko'+key]={a:res.ca,b:res.cb};delete S.ko.results[key];commit()}
const roundName=n=>({1:'Finale',2:'Halbfinale',4:'Viertelfinale',8:'Achtelfinale',16:'Sechzehntelfinale'})[n]||('Runde mit '+n);

/* timer */
const T=()=>S.timer;
function remaining(){const t=T();if(t.status==='running')return Math.max(0,t.endAt-Date.now());if(t.status==='idle')return S.settings.minutes*60000;return t.remaining}
function tState(){const t=T();if(t.status==='running'&&Date.now()>=t.endAt)return'over';return t.status}
function tStart(){const t=T();const rem=t.status==='paused'?t.remaining:S.settings.minutes*60000;S.timer={status:'running',endAt:Date.now()+rem,remaining:rem,startedAt:Date.now(),dur:t.status==='paused'?t.dur:rem};commit()}
function tPause(){const t=T();if(t.status!=='running')return;S.timer=Object.assign({},t,{status:'paused',remaining:Math.max(0,t.endAt-Date.now())});commit()}
function tReset(){S.timer={status:'idle',endAt:0,remaining:S.settings.minutes*60000,startedAt:0,dur:S.settings.minutes*60000};commit()}
function tAdd(){const t=T();if(t.status==='running'){t.endAt=Math.max(Date.now(),t.endAt)+60000;t.dur+=60000}else if(t.status==='paused'){t.remaining+=60000;t.dur+=60000}commit()}

/* sound (beamer device only, after a click) */
let actx=null;
function beep(freqs,len){if(!ui.sound)return;try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();let t0=actx.currentTime;freqs.forEach(f=>{const o=actx.createOscillator(),g=actx.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.15,t0);g.gain.exponentialRampToValueAtTime(.001,t0+len);o.connect(g).connect(actx.destination);o.start(t0);o.stop(t0+len);t0+=len*0.9})}catch(e){}}

/* ---------- rendering ---------- */
const view=()=>{const h=(location.hash||'').slice(1);return['teams','gruppen','ko','anzeige'].includes(h)?h:(S.groups.length?'gruppen':'teams')};

function headerHTML(v){
  return `<header>
  <div class="brand"><div class="fsr" aria-hidden="true"><span style="background:var(--blue)">F</span><span style="background:var(--green)">S</span><span style="background:var(--red)">R</span></div>
  <div><h1>Bierpong-Turnier</h1><p>20.11. · Haus 70 · auf ${S.settings.cups} Becher · ${S.settings.minutes} Min</p></div></div>
  <nav aria-label="Bereiche">
   ${[['teams','Teams'],['gruppen','Gruppen'],['ko','K.-o.']].map(([k,l])=>`<a href="#${k}" ${v===k?'aria-current="page"':''}>${l}</a>`).join('')}
   <a href="#anzeige" class="show">Beamer-Anzeige ▶</a>
  </nav>
  <div id="sync" class="sync ${syncState}"><i></i><span>${esc(label())}</span></div>
  </header>`;
}
function timerbarHTML(){
  const st=tState();const lab={idle:'bereit',running:'läuft',paused:'pausiert',over:'TIMEOUT'}[st];
  return `<section class="timerbar" aria-label="Rundentimer">
   <span class="prompt" style="margin-right:4px">./runde --timer</span>
   <span class="tb-time" data-timer>${fmt(remaining())}</span>
   <span class="tb-state ${st==='running'?'run':st==='over'?'over':''}" data-tstate>${lab}</span>
   <div class="row">
    ${st==='running'?`<button class="btn" data-act="tpause">Pause</button>`:''}
    ${st==='idle'||st==='paused'?`<button class="btn go" data-act="tstart">${st==='paused'?'Weiter':'Runde starten'}</button>`:''}
    ${st==='running'||st==='paused'?`<button class="btn small" data-act="tadd">+1 Min</button>`:''}
    ${st!=='idle'?`<button class="btn ${st==='over'?'primary':''}" data-act="treset">${st==='over'?'Nächste Runde vorbereiten':'Zurücksetzen'}</button>`:''}
   </div></section>`;
}

  const txt=ui.teamText!=null?ui.teamText:S.teams.map(t=>t.name).join('\n');
  const names=parseTeams(txt);const n=names.length;
  const maxG=Math.max(1,Math.floor(n/3));const gc=Math.min(+S.settings.groups,maxG);
  const started=S.matches.some(m=>m.done);
  const opts=Array.from({length:Math.max(1,Math.min(8,maxG))},(_,i)=>i+1).map(i=>`<option value="${i}" ${i===gc?'selected':''}>${i} Gruppe${i>1?'n':''}</option>`).join('');
  return `<div class="grid2">
  <section class="panel">
   <span class="prompt">nano teams.txt</span>
   <h2>Teams eintragen</h2>
   <p class="hint">Ein Team pro Zeile. Ihr könnt die Namen direkt aus der Google-Form-Tabelle kopieren. Einzelanmeldungen vorher zu Teams zusammenlegen.</p>
   <textarea id="teamtext" spellcheck="false" placeholder="Team 1&#10;Team 2&#10;…">${esc(txt)}</textarea>
   <div class="row"><span class="mono tab-num" style="color:var(--muted)">${n} Teams erkannt</span>
    <button class="btn small" data-act="demo">Beispielteams einfügen</button></div>
  </section>
  <section class="panel">
   <span class="prompt">./setup</span>
   <h2>Turnier-Einstellungen</h2>
   <div class="row" style="align-items:flex-end">
    <label class="field">Gruppen<select id="s-groups" ${n<6?'disabled':''}>${opts}</select></label>
    <label class="field">Weiter pro Gruppe<select id="s-adv">${[1,2,3].map(i=>`<option ${i==S.settings.advance?'selected':''}>${i}</option>`).join('')}</select></label>
    <label class="field">Becher<input id="s-cups" type="number" min="1" max="20" value="${S.settings.cups}" style="width:80px"></label>
    <label class="field">Minuten<input id="s-min" type="number" min="1" max="60" value="${S.settings.minutes}" style="width:80px"></label>
   </div>
   <p class="hint">${n>=4?`Gruppen mit ${Math.floor(n/gc)}${n%gc?'–'+Math.ceil(n/gc):''} Teams: jedes Team spielt mindestens ${Math.floor(n/gc)-1} Mal in der Gruppe. Jeder gegen jeden, Sieg 3 Punkte, Gleichstand nach Zeit 1 Punkt.`:'Mindestens 4 Teams eintragen, dann könnt ihr auslosen.'}</p>
   ${ui.confirm==='draw'?`<div class="confirmbox"><span>Es gibt schon Ergebnisse. Neu auslosen löscht alle Gruppen- und K.-o.-Spiele.</span><button class="btn stop small" data-act="draw-yes">Ja, neu auslosen</button><button class="btn small" data-act="cancel">Abbrechen</button></div>`:''}
   <div class="row"><button class="btn primary" data-act="draw" ${n<4?'disabled':''}>${S.groups.length?'Neu auslosen':'Gruppen auslosen'} 🎲</button>${started?'<span class="notice">Achtung: Ergebnisse vorhanden</span>':''}</div>
  </section></div>`;
}
function matchHTML(m){
  const d=drafts[m.id];const c=S.settings.cups;
  if(m.done&&!d){
    return `<div class="match done"><span class="t ${m.ca>m.cb?'win':''}">${esc(tname(m.a))}</span><span class="score">${m.ca}</span><span class="vs">:</span><span class="score">${m.cb}</span><span class="t b ${m.cb>m.ca?'win':''}">${esc(tname(m.b))}</span><span class="act"><button class="btn small" data-act="edit" data-id="${m.id}" aria-label="Ergebnis ändern">ändern</button></span></div>`;
  }
  const va=d&&d.a!=null?d.a:'',vb=d&&d.b!=null?d.b:'';
  return `<div class="match"><span class="t">${esc(tname(m.a))}</span>
   <input id="ma-${m.id}" data-draft="${m.id}" data-side="a" type="number" inputmode="numeric" min="0" max="${c}" value="${va}" aria-label="Becher getroffen ${esc(tname(m.a))}" placeholder="0">
   <span class="vs">:</span>
   <input id="mb-${m.id}" data-draft="${m.id}" data-side="b" type="number" inputmode="numeric" min="0" max="${c}" value="${vb}" aria-label="Becher getroffen ${esc(tname(m.b))}" placeholder="0">
   <span class="t b">${esc(tname(m.b))}</span>
   <span class="act"><button class="btn small go" data-act="save" data-id="${m.id}">✓</button></span></div>
   ${d&&d.err?`<span class="notice">Bitte für beide Teams 0 bis ${c} Becher eintragen.</span>`:''}`;
}
function tableHTML(g,mini){
  const rows=standings(g);const adv=+S.settings.advance;
  return `<div class="tablewrap"><table><thead><tr><th>#</th><th style="text-align:left">Team</th><th>Sp</th>${mini?'':'<th>S</th><th>U</th><th>N</th>'}<th>Becher</th><th>Diff</th><th>Pkt</th></tr></thead><tbody>
  ${rows.map((r,i)=>`<tr class="${i<adv?'q':''}"><td>${i+1}</td><td>${esc(tname(r.id))}</td><td>${r.sp}</td>${mini?'':`<td>${r.s}</td><td>${r.u}</td><td>${r.n}</td>`}<td>${r.cf}:${r.ca}</td><td>${r.cf-r.ca>0?'+':''}${r.cf-r.ca}</td><td class="pts">${r.pts}</td></tr>`).join('')}
  </tbody></table></div>`;
}
function groupsHTML(){
  if(!S.groups.length)return `<section class="panel"><div class="empty"><strong>Noch keine Gruppen</strong><span>Tragt unter „Teams“ alle Teams ein und lost die Gruppen aus.</span><a class="btn primary" href="#teams" style="text-decoration:none">Zu den Teams</a></div></section>`;
  const total=S.matches.length,done=S.matches.filter(m=>m.done).length;
  return `<section class="panel" style="flex-direction:row;flex-wrap:wrap;align-items:center;gap:14px">
    <span class="prompt">progress --gruppenphase</span><span class="mono tab-num">${done}/${total} Spiele eingetragen</span>
    <div class="row" style="margin-left:auto">${S.ko?`<a class="btn" href="#ko" style="text-decoration:none">Zum K.-o.-Baum</a>`:''}
    ${ui.confirm==='ko'?`<span class="notice">Noch ${total-done} Spiele offen. Trotzdem?</span><button class="btn stop small" data-act="ko-yes">Ja, K.-o. erstellen</button><button class="btn small" data-act="cancel">Abbrechen</button>`:
    `<button class="btn primary" data-act="mkko">${S.ko?'K.-o.-Baum neu erstellen':'K.-o.-Runde erstellen'}</button>`}</div></section>
  <div class="groups">${S.groups.map(g=>{
    const ms=S.matches.filter(m=>m.g===g.i);const rounds=[...new Set(ms.map(m=>m.r))];
    return `<section class="panel"><div class="ghead"><span class="gbadge" style="background:${COLORS[g.i%COLORS.length]}">${gl(g.i)}</span><h2>Gruppe ${gl(g.i)}</h2></div>
     ${tableHTML(g,false)}
     <div class="matches">${rounds.map(r=>`<div class="rlabel">// Runde ${r+1}</div>`+ms.filter(m=>m.r===r).map(matchHTML).join('')).join('')}</div>
    </section>`}).join('')}</div>`;
}
function kocardHTML(m,interactive){
  const key=m.key,d=drafts['ko'+key];const c=S.settings.cups;
  const ready=m.a!=null&&m.b!=null;
  const nm=id=>id===undefined?'<span class="t tbd">wartet …</span>':id===null?'<span class="t tbd">Freilos</span>':`<span class="t ${m.done&&m.w===id&&!m.bye?'win':''}">${esc(tname(id))}</span>`;
  if(m.bye)return `<div class="kocard done"><div class="kline">${nm(m.a)}</div><div class="kline">${nm(m.b)}</div></div>`;
  if(m.done&&!d)return `<div class="kocard done"><div class="kline">${nm(m.a)}<span class="score">${m.ca}</span></div><div class="kline">${nm(m.b)}<span class="score">${m.cb}</span></div>${interactive?`<div class="row" style="justify-content:flex-end"><button class="btn small" data-act="koedit" data-key="${key}">ändern</button></div>`:''}</div>`;
  if(!interactive||!ready)return `<div class="kocard"><div class="kline">${nm(m.a)}</div><div class="kline">${nm(m.b)}</div></div>`;
  const va=d&&d.a!=null?d.a:'',vb=d&&d.b!=null?d.b:'';
  return `<div class="kocard"><div class="kline">${nm(m.a)}<input id="ka-${key}" data-kodraft="${key}" data-side="a" type="number" inputmode="numeric" min="0" max="${c}" value="${va}" aria-label="Becher ${esc(tname(m.a))}" placeholder="0"></div>
   <div class="kline">${nm(m.b)}<input id="kb-${key}" data-kodraft="${key}" data-side="b" type="number" inputmode="numeric" min="0" max="${c}" value="${vb}" aria-label="Becher ${esc(tname(m.b))}" placeholder="0"></div>
   ${d&&d.err?`<span class="notice">0 bis ${c} Becher eintragen.</span>`:''}
   ${d&&d.tie?`<span class="notice">Gleichstand – wer hat den Nachwurf gewonnen?</span><div class="row"><button class="btn small" data-act="kow" data-key="${key}" data-w="a">${esc(tname(m.a))}</button><button class="btn small" data-act="kow" data-key="${key}" data-w="b">${esc(tname(m.b))}</button></div>`:
   `<div class="row" style="justify-content:flex-end"><button class="btn small go" data-act="kosave" data-key="${key}">✓ Eintragen</button></div>`}</div>`;
}
function champion(R){const f=R&&R[R.length-1][0];return f&&f.done&&f.w!=null?f.w:null}
function koHTML(){
  const R=koView();
  if(!R)return `<section class="panel"><div class="empty"><strong>Die K.-o.-Runde startet nach der Gruppenphase</strong><span>Die besten ${S.settings.advance} jeder Gruppe kommen weiter. Gruppensieger treffen dabei auf Zweite aus anderen Gruppen.</span>${S.groups.length?`<button class="btn primary" data-act="mkko">K.-o.-Runde erstellen</button>`:`<a class="btn primary" href="#teams" style="text-decoration:none">Erst Teams eintragen</a>`}</div></section>`;
  const ch=champion(R);
  return `${ch!=null?`<div class="champ"><span style="font-size:40px">🏆</span><div><div class="prompt">winner --final</div><b>${esc(tname(ch))}</b></div></div>`:''}
  <section class="panel"><span class="prompt">tree ./ko-runde</span><h2>K.-o.-Baum</h2>
   <p class="hint">Bei Gleichstand nach Zeit entscheidet ein Nachwurf. Ihr wählt den Sieger dann per Knopf aus.</p>
   <div class="bracket">${R.map(r=>`<div class="round"><h3>${roundName(r.length)}</h3>${r.map(m=>kocardHTML(m,true)).join('')}</div>`).join('')}</div>
  </section>`;
}
function nextMatches(){
  const out=[];S.groups.forEach(g=>{const open=S.matches.filter(m=>m.g===g.i&&!m.done);if(!open.length)return;const r=Math.min(...open.map(m=>m.r));open.filter(m=>m.r===r).forEach(m=>out.push(m))});return out;
}
function showHTML(){
  const st=tState();const rem=remaining();const dur=T().dur||S.settings.minutes*60000;
  const starting=st==='running'&&Date.now()-T().startedAt<4000;
  const cls=st==='over'?'over':starting?'starting':(st==='running'&&rem<60000?'low':'');
  const lbl=st==='over'?'TIMEOUT · Würfe stoppen, Becher zählen!':starting?'LOS GEHT’S! 🍺':st==='running'?'Runde läuft':st==='paused'?'Pausiert':'Wartet auf Start';
  const R=koView();const ch=champion(R);
  let side='';
  if(R){
    side=`<section class="panel">${ch!=null?`<div class="champ"><span style="font-size:34px">🏆</span><b>${esc(tname(ch))}</b></div>`:''}<h2>K.-o.-Runde</h2><div class="show-ko">${R.map(r=>`<div class="round"><h3>${roundName(r.length)}</h3>${r.map(m=>kocardHTML(m,false)).join('')}</div>`).join('')}</div></section>`;
  }else if(S.groups.length){
    const nx=nextMatches();
    side=`<section class="panel"><span class="prompt">queue --next</span><h2>Nächste Spiele</h2><div class="nextlist">${nx.length?nx.map(m=>`<div class="nextm"><span class="gbadge" style="background:${COLORS[m.g%COLORS.length]}">${gl(m.g)}</span><span>${esc(tname(m.a))}</span><span class="vs">vs</span><span>${esc(tname(m.b))}</span></div>`).join(''):'<span class="hint">Gruppenphase fertig – gleich geht’s mit der K.-o.-Runde weiter!</span>'}</div></section>
    <section class="panel"><h2>Tabellen</h2><div class="minitables">${S.groups.map(g=>`<div><div class="ghead" style="margin-bottom:4px"><span class="gbadge" style="width:24px;height:24px;font-size:12px;border-radius:6px;background:${COLORS[g.i%COLORS.length]}">${gl(g.i)}</span><b>Gruppe ${gl(g.i)}</b></div>${tableHTML(g,true)}</div>`).join('')}</div></section>`;
  }else side=`<section class="panel"><div class="empty"><strong>Willkommen zum Bierpong-Turnier!</strong><span>Gleich werden die Gruppen ausgelost.</span></div></section>`;
  return `<div class="show-root">
   <div class="show-top">${headerHTML('anzeige').replace(/<nav[\s\S]*<\/nav>/,'').replace(/<div id="sync"[\s\S]*?<\/div>\s*<\/header>/,'</header>')}
    <div class="row"><button class="btn small" data-act="sound" aria-pressed="${ui.sound}">${ui.sound?'🔊 Ton an':'🔇 Ton aktivieren'}</button><button class="btn small" data-act="fs">Vollbild</button><a class="btn small" href="#gruppen" style="text-decoration:none">Zur Steuerung</a></div></div>
   <div class="show-main">
    <div class="clock ${cls}" data-clock><div class="bubbles" aria-hidden="true">${Array.from({length:14},(_,i)=>`<span style="left:${(i*7.3)%100}%;width:${8+i%4*6}px;height:${8+i%4*6}px;animation-duration:${7+i%5*2}s;animation-delay:-${i*1.3}s"></span>`).join('')}</div>
     <div class="lbl" data-clbl>${lbl}</div><div class="big" data-cbig>${fmt(rem)}</div>
     <div class="bar"><i data-cbar style="width:${st==='idle'?100:Math.max(0,Math.min(100,rem/dur*100))}%"></i></div>
     <div class="lbl mono">${S.settings.cups} Becher · ${S.settings.minutes} Min · danach zählen</div></div>
    <div class="side">${side}</div>
   </div></div>`;
}

function render(){
  const v=view();const app=document.getElementById('app');
  const f=document.activeElement;const fid=f&&f.id;const sel=f&&f.selectionStart!=null?[f.selectionStart,f.selectionEnd]:null;
  if(v==='anzeige'){app.innerHTML=showHTML()}
  else app.innerHTML=`<div class="wrap">${headerHTML(v)}${v!=='teams'?timerbarHTML():''}${v==='teams'?teamsHTML():v==='gruppen'?groupsHTML():koHTML()}</div>`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel&&el.setSelectionRange){try{el.setSelectionRange(sel[0],sel[1])}catch(e){}}}}
}

/* live tick: only text nodes, no writes */
let lastSt=null,lastStarting=false;
setInterval(()=>{
  const st=tState();const starting=st==='running'&&Date.now()-T().startedAt<4000;
  if(st!==lastSt||starting!==lastStarting){
    if(lastSt!==null&&st==='over')beep([880,660,880,660,440],.35);
    if(lastSt!==null&&starting&&!lastStarting)beep([523,659,784],.18);
    const changed=lastSt!==null;lastSt=st;lastStarting=starting;
    if(changed){if(document.activeElement&&document.activeElement.matches('input,textarea,select')&&view()!=='anzeige'){const ts=document.querySelector('[data-tstate]');if(ts)ts.textContent=st}else{render();return}}
  }
  const rem=remaining();
  document.querySelectorAll('[data-timer],[data-cbig]').forEach(e=>e.textContent=fmt(rem));
  const bar=document.querySelector('[data-cbar]');if(bar&&st!=='idle')bar.style.width=Math.max(0,Math.min(100,rem/(T().dur||1)*100))+'%';
  const c=document.querySelector('[data-clock]');if(c&&st==='running'&&!starting)c.classList.toggle('low',rem<60000);
},250);

/* ---------- events ---------- */
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='teamtext'){ui.teamText=t.value;const n=parseTeams(t.value).length;const s=t.parentNode.querySelector('.mono');if(s)s.textContent=n+' Teams erkannt';clearTimeout(ui.tt);ui.tt=setTimeout(render,700);return}
  if(t.dataset.draft){const d=drafts[t.dataset.draft]=drafts[t.dataset.draft]||{};d[t.dataset.side]=t.value;d.err=false}
  if(t.dataset.kodraft){const k='ko'+t.dataset.kodraft;const d=drafts[k]=drafts[k]||{};d[t.dataset.side]=t.value;d.err=false;d.tie=false}
});
document.addEventListener('change',e=>{
  const t=e.target,s=S.settings;
  if(t.id==='s-groups'){s.groups=+t.value;commit()}
  else if(t.id==='s-adv'){s.advance=+t.value;commit()}
  else if(t.id==='s-cups'){s.cups=Math.max(1,Math.min(20,+t.value||10));commit()}
  else if(t.id==='s-min'){s.minutes=Math.max(1,Math.min(60,+t.value||10));if(S.timer.status==='idle'){S.timer.remaining=S.timer.dur=s.minutes*60000}commit()}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;const t=e.target;
  if(t.dataset.draft){e.preventDefault();if(t.dataset.side==='a'){const b=document.getElementById('mb-'+t.dataset.draft);if(b)b.focus()}else saveMatch(t.dataset.draft)}
  if(t.dataset.kodraft){e.preventDefault();if(t.dataset.side==='a'){const b=document.getElementById('kb-'+t.dataset.kodraft);if(b)b.focus()}else saveKO(t.dataset.kodraft)}
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='demo'){const cur=parseTeams(ui.teamText!=null?ui.teamText:S.teams.map(t=>t.name).join('\n'));ui.teamText=[...cur,...DEMO.filter(d=>!cur.includes(d))].slice(0,Math.max(cur.length,12)).join('\n');if(cur.length>=12)ui.teamText=cur.join('\n');render()}
  else if(a==='draw'){if(S.matches.some(m=>m.done)||S.ko){ui.confirm='draw';render()}else draw()}
  else if(a==='draw-yes')draw();
  else if(a==='cancel'){ui.confirm=null;render()}
  else if(a==='save')saveMatch(b.dataset.id);
  else if(a==='edit')editMatch(b.dataset.id);
  else if(a==='mkko'){if(S.matches.some(m=>!m.done)){ui.confirm='ko';render()}else buildKO()}
  else if(a==='ko-yes')buildKO();
  else if(a==='kosave')saveKO(b.dataset.key);
  else if(a==='kow'){const R=koView();const [r,i]=b.dataset.key.split('-').map(Number);const m=R[r][i];saveKO(b.dataset.key,0,0,b.dataset.w==='a'?m.a:m.b)}
  else if(a==='koedit')editKO(b.dataset.key);
  else if(a==='tstart')tStart();else if(a==='tpause')tPause();else if(a==='treset')tReset();else if(a==='tadd')tAdd();
  else if(a==='sound'){ui.sound=!ui.sound;if(ui.sound)beep([660],.12);render()}
  else if(a==='fs'){const el=document.documentElement;try{(document.fullscreenElement?document.exitFullscreen():el.requestFullscreen()).catch(()=>{})}catch(err){}}
});
window.addEventListener('hashchange',()=>{ui.confirm=null;render()});
window.addEventListener('storage',e=>{
  if(e.key!==KEY||!e.newValue||e.newValue===lastJson)return;
